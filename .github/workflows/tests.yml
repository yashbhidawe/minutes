# CI for the FastAPI server (pytest).
#
# Runs the full server test suite on every push to dev and every pull request
# targeting dev that touches server code. Requires no repository secrets; the
# only system dependency installed is ffmpeg (needed by pydub for audio tests).
name: Server Tests

on:
  push:
    branches:
      - dev
    paths:
      - "server/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches:
      - dev
    paths:
      - "server/**"
      - ".github/workflows/tests.yml"

# Supersede stale runs on the same branch to save Actions minutes.
concurrency:
  group: server-tests
  cancel-in-progress: true

jobs:
  test:
    name: pytest (server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 with pip caching
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "server/requirements*.txt"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Run tests
        working-directory: server
        run: pytest -q
