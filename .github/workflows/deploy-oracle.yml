# CD for the Oracle Always Free VM (api + worker + redis + caddy).
#
# Triggers on pushes to dev that touch the backend or compose files.
# Requires repo secrets (Settings → Secrets and variables → Actions):
#   ORACLE_HOST     e.g. 137.23.40.60
#   ORACLE_USER     e.g. opc
#   ORACLE_SSH_KEY  the VM login private key (never paste it in chat/logs)
#
# The VM pulls over SSH using its own deploy key (already configured via
# `git config core.sshCommand` on the box), so no GitHub token is needed here.

name: Deploy to Oracle VM

on:
  push:
    branches: [dev]
    paths:
      - "server/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/deploy-oracle.yml"

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pull and rebuild on the VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_HOST || '137.23.40.60' }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          request_pty: false
          script: |
            set -euo pipefail
            cd ~/minuteai
            git pull --ff-only
            docker compose up -d --build
            docker image prune -f
            sleep 10
            docker compose ps
            curl -sf http://localhost:8000/ | grep -q Hello && echo "API OK"
