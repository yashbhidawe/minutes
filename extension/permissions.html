<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Minutes — Grant Microphone Permission</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafaf9;
      color: #1c1917;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      border: 1px solid #e7e5e4;
      border-radius: 12px;
      padding: 32px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      font-size: 13px;
      color: #57534e;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      background: #1c1917;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #292524;
    }
    .success {
      color: #15803d;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Microphone Permission Setup</h1>
    <p>To record both your microphone and Google Meet tab audio, Minutes needs one-time microphone access permission for this browser extension.</p>
    <button id="grant-btn" class="btn">Enable Microphone Access</button>
    <div id="status-msg" class="hidden"></div>
  </div>

  <script src="permissions.js"></script>
</body>
</html>
