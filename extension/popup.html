<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafaf9;
      color: #1c1917;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid #e7e5e4;
    }

    .header h1 {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #78716c;
    }

    .content {
      padding: 20px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #d6d3d1;
    }

    .status-dot.active {
      background: #16a34a;
    }

    .status-dot.recording {
      background: #dc2626;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 13px;
      color: #78716c;
    }

    .status-text strong {
      color: #1c1917;
      font-weight: 500;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .login-form input {
      padding: 8px 0;
      border: none;
      border-bottom: 1px solid #e7e5e4;
      background: transparent;
      font-size: 13px;
      color: #1c1917;
      outline: none;
    }

    .login-form input:focus {
      border-bottom-color: #1c1917;
    }

    .login-form input::placeholder {
      color: #d6d3d1;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary {
      background: #1c1917;
      color: white;
      margin-top: 4px;
    }

    .btn-primary:hover {
      background: #44403c;
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: #78716c;
      padding: 0;
    }

    .btn-ghost:hover {
      color: #1c1917;
    }

    .error {
      font-size: 12px;
      color: #dc2626;
      margin-top: 4px;
    }

    .user-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .user-email {
      font-size: 12px;
      color: #78716c;
    }

    .divider {
      height: 1px;
      background: #e7e5e4;
      margin: 16px 0;
    }

    .meeting-info {
      font-size: 12px;
      color: #78716c;
      line-height: 1.5;
    }

    .meeting-info strong {
      color: #1c1917;
    }

    .footer {
      padding: 12px 20px;
      border-top: 1px solid #e7e5e4;
      font-size: 10px;
      color: #d6d3d1;
      text-align: center;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Minute AI</h1>
  </div>

  <div class="content">
    <!-- Not logged in -->
    <div id="login-view">
      <div class="status">
        <div class="status-dot"></div>
        <span class="status-text">Not connected</span>
      </div>
      <form class="login-form" id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign in</button>
        <div class="error hidden" id="login-error"></div>
      </form>
    </div>

    <!-- Logged in -->
    <div id="main-view" class="hidden">
      <div class="user-info">
        <span class="user-email" id="user-email"></span>
        <button class="btn btn-ghost" id="logout-btn">Sign out</button>
      </div>

      <div class="status" id="status-area">
        <div class="status-dot" id="status-dot"></div>
        <span class="status-text" id="status-text">Ready</span>
      </div>

      <div class="divider"></div>

      <div class="meeting-info" id="meeting-info">
        Open Google Meet to start recording.
      </div>
    </div>
  </div>

  <div class="footer">
    Auto-captures audio on call end
  </div>

  <script src="popup.js"></script>
</body>
</html>
