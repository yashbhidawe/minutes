services:
  redis:
    image: redis:7-alpine
    container_name: minuteai_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: minuteai_api
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: minuteai_worker
    # Solo pool: the default DATABASE_URL is SQLite, which corrupts/locks
    # under prefork concurrency. If you switch to Postgres, use prefork:
    # celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    command: celery -A app.core.celery_app.celery_app worker --pool=solo --loglevel=info
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api
    restart: always

  caddy:
    image: caddy:2-alpine
    container_name: minuteai_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: always

volumes:
  caddy_data:
  caddy_config:
