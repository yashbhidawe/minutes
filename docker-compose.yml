services:
  redis:
    image: redis:7-alpine
    container_name: minuteai_redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: minuteai_api
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: minuteai_worker
    command: celery -A app.core.celery_app.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - ./server/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - api
    restart: always
